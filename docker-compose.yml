version: '3.8'

services:
  hosting-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rehoster-panel
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    volumes:
      # NOTE: Mounting the Docker socket grants the container Docker daemon access.
      # Use Docker's rootless mode or a socket proxy (e.g. tecnativa/docker-socket-proxy)
      # in hardened production environments.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./managed-apps:/app/managed-apps
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/hosting-panel.sqlite
      MANAGED_APPS_DIR: /app/managed-apps
    command: ["sh", "-lc", "node src/db/init.js && node src/server.js"]
    networks:
      - rehoster-net

networks:
  rehoster-net:
    driver: bridge
